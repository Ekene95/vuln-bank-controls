apiVersion: v1
kind: ConfigMap
metadata:
  name: falco-config
  namespace: falco
data:
  falco.yaml: |
    json_output: true
    json_include_output_property: true

    json_include_tags_property: true

    # ─────────────────────────────────────────────────────────────
    # Alert output — choose ONE of the following two sections
    # ─────────────────────────────────────────────────────────────

    # Option A: Slack webhook (requires a webhook URL)
    # Uncomment and replace the URL with your Slack webhook:
    # alert_routes:
    #   - name: slack
    #     type: slack
    #     url: https://hooks.slack.com/services/T00000000/B00000000/xxxxxxxxxxxx
    #     channel: "#security-alerts"
    #     priority: WARNING

    # Option B: File output (fallback — works without external services)
    file_output:
      enabled: true
      keep_alive: false
      filename: /var/log/falco/alerts.json

    # ─────────────────────────────────────────────────────────────
    # Priority at which to send alerts
    # Options: EMERGENCY, ALERT, CRITICAL, ERROR, WARNING, NOTICE, INFO, DEBUG
    # ─────────────────────────────────────────────────────────────
    priority: WARNING

    # ─────────────────────────────────────────────────────────────
    # Output format
    # ─────────────────────────────────────────────────────────────
    stdout_output:
      enabled: true

    webhook_output:
      enabled: false

    syscall_event_drops:
      actions:
        - log
      rate: 0.05
      max_burst: 50
