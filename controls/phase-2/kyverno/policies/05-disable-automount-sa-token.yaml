# Policy 3: disable-automount-sa-token
#
# WHY THIS EXISTS FOR VULNBANK:
# By default Kubernetes mounts a service account token into every pod
# at /var/run/secrets/kubernetes.io/serviceaccount/token. This token
# can authenticate to the Kubernetes API server.
#
# VulnBank has SSRF, RCE via file upload, and path traversal. Any of
# these could allow an attacker to read the mounted token and use it
# to enumerate namespaces, list secrets, or escalate within the cluster.
# Neither the Flask app nor PostgreSQL calls the K8s API — this token
# is purely unnecessary attack surface.
#
# This also enforces what the SonarQube scanner flagged as a finding
# on the Phase 1 manifests, ensuring it cannot silently regress.
#
# VERIFICATION:
#   # Token should NOT be present in a running pod:
#   kubectl exec -n vuln-bank \
#     $(kubectl get pod -n vuln-bank -l app=vuln-bank -o name | head -1) \
#     -- ls /var/run/secrets/kubernetes.io/serviceaccount/ 2>&1
#   # Expected: ls: cannot access ...: No such file or directory

apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disable-automount-sa-token
  annotations:
    policies.kyverno.io/title: Disable Automount Service Account Token
    policies.kyverno.io/category: Security
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Pods in the application namespaces must explicitly opt out of the
      default service account token mount. These workloads have no
      legitimate need to call the Kubernetes API.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: check-automount-disabled
      match:
        any:
        - resources:
            kinds: ["Pod"]
            namespaces:
              - vuln-bank
              - vuln-bank-db
      validate:
        message: >-
          automountServiceAccountToken must be set to false. Pods in vuln-bank
          and vuln-bank-db have no need for Kubernetes API credentials.
        pattern:
          spec:
            automountServiceAccountToken: false
