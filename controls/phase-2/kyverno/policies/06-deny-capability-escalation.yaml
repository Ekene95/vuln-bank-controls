# Policy 6: deny-capability-escalation
#
# Requires allowPrivilegeEscalation: false and that ALL Linux capabilities
# are dropped on containers in the vuln-bank and vuln-bank-db namespaces.
#
# Why this matters for VulnBank:
#   Linux capabilities divide root privileges into discrete units.
#   Even when running as non-root, a container with capabilities like
#   CAP_NET_ADMIN, CAP_SYS_PTRACE, or CAP_DAC_OVERRIDE can perform
#   privileged operations. Neither VulnBank nor PostgreSQL needs any
#   capabilities to function normally.
#
#   allowPrivilegeEscalation: false prevents setuid/setgid binaries
#   inside the container from gaining elevated privileges — this blocks
#   a common post-exploitation technique.

apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: deny-capability-escalation
  annotations:
    policies.kyverno.io/title: Deny Capability Escalation
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Containers must drop all Linux capabilities and set
      allowPrivilegeEscalation to false.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: check-capabilities-dropped
      match:
        any:
        - resources:
            kinds: ["Pod"]
            namespaces:
              - vuln-bank
              - vuln-bank-db
      validate:
        message: >-
          All containers must drop all capabilities
          (securityContext.capabilities.drop: ["ALL"]) and set
          allowPrivilegeEscalation: false.
        pattern:
          spec:
            containers:
              - securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                      - ALL
