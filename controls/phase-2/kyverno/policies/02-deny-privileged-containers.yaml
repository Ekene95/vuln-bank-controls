# Policy 2: deny-privileged-containers
#
# WHY THIS EXISTS FOR VULNBANK:
# Privileged containers share the host kernel namespace and can escape
# the container boundary entirely. A privileged container compromised
# via VulnBank's RCE paths gives an attacker full access to the
# Proxmox host. There is no reason any VulnBank workload needs
# privileged mode.
#
# This policy also blocks hostNetwork, hostPID, hostIPC, and hostPath
# volume mounts — all container escape primitives with no legitimate
# use in this stack.
#
# validationFailureAction: Enforce
# This is safe to enforce immediately — no legitimate VulnBank workload
# uses any of these primitives. Unlike Audit policies, this one blocks
# at deploy time without needing a burn-in period.
#
# VERIFICATION:
#   # All of the following should be blocked:
#   kubectl run priv-test --image=alpine -n vuln-bank \
#     --overrides='{"spec":{"containers":[{"name":"t","image":"alpine","securityContext":{"privileged":true}}]}}'
#   # Expected: Error from server: admission webhook denied the request

apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: deny-privileged-containers
  annotations:
    policies.kyverno.io/title: Deny Privileged Containers
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: critical
    policies.kyverno.io/description: >-
      Privileged containers, hostNetwork, hostPID, hostIPC, and hostPath
      volume mounts are container escape vectors. None of the VulnBank
      workloads require these. Blocked across all application namespaces.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: deny-privileged
      match:
        any:
        - resources:
            kinds: ["Pod"]
            namespaces:
              - vuln-bank
              - vuln-bank-db
              - kong
      validate:
        message: "Privileged containers are not allowed."
        pattern:
          spec:
            containers:
              - =(securityContext):
                  =(privileged): false

    - name: deny-host-namespaces
      match:
        any:
        - resources:
            kinds: ["Pod"]
            namespaces:
              - vuln-bank
              - vuln-bank-db
              - kong
      validate:
        message: "hostNetwork, hostPID, and hostIPC are not allowed."
        pattern:
          spec:
            =(hostNetwork): false
            =(hostPID): false
            =(hostIPC): false

    - name: deny-host-path-mounts
      match:
        any:
        - resources:
            kinds: ["Pod"]
            namespaces:
              - vuln-bank
              - vuln-bank-db
              - kong
      validate:
        message: >-
          hostPath volume mounts expose the node filesystem to the container.
          Use PersistentVolumeClaims or emptyDir instead.
        deny:
          conditions:
            any:
            - key: "{{ request.object.spec.volumes[].hostPath | length(@) }}"
              operator: GreaterThan
              value: 0
