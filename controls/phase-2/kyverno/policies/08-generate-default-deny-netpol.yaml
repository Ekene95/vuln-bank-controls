# Policy: generate-default-deny-networkpolicy
#
# WHY THIS EXISTS FOR VULNBANK:
# Phase 1 manually created NetworkPolicies for vuln-bank and
# vuln-bank-db. But if someone adds a new namespace (for Phase 2
# tooling, for a test pod, for anything), that namespace starts with
# unrestricted networking by default. In a financial environment this
# is how lateral movement happens — a new namespace with no policy
# becomes a staging ground.
#
# This is Kyverno's GENERATE capability — something OPA Gatekeeper
# cannot do. When a new namespace is created with the label
# "network-policy: default-deny", Kyverno automatically creates a
# default-deny NetworkPolicy in it. The developer doesn't have to
# remember to do it manually.
#
# USAGE:
#   # Any namespace created with this label gets auto-protected:
#   kubectl label namespace <new-ns> network-policy=default-deny
#
#   # Or add it to the namespace manifest:
#   metadata:
#     labels:
#       network-policy: default-deny
#
# VERIFICATION:
#   kubectl create namespace test-ns
#   kubectl label namespace test-ns network-policy=default-deny
#   kubectl get networkpolicies -n test-ns
#   # Expected: default-deny policy auto-created by Kyverno
#
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: generate-default-deny-networkpolicy
  annotations:
    policies.kyverno.io/title: Generate Default-Deny NetworkPolicy
    policies.kyverno.io/category: Network Security
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >
      Automatically creates a default-deny NetworkPolicy in any namespace
      labelled network-policy=default-deny. This ensures new namespaces
      are isolated by default without requiring manual policy creation.
      Uses Kyverno's generate capability — not available in OPA Gatekeeper.
spec:
  rules:
    - name: generate-default-deny
      match:
        any:
        - resources:
            kinds: ["Namespace"]
            selector:
              matchLabels:
                network-policy: default-deny
      generate:
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        name: default-deny-all
        namespace: "{{request.object.metadata.name}}"
        synchronize: true   # Kyverno re-creates the policy if deleted
        data:
          metadata:
            labels:
              generated-by: kyverno
              policy: default-deny-networkpolicy
          spec:
            podSelector: {}      # Applies to all pods in the namespace
            policyTypes:
              - Ingress
              - Egress
            # No ingress or egress rules = deny all traffic
            # Explicit allow rules in individual netpol files override this
