# Policy 3: require-resource-limits
#
# All containers must define CPU, memory, and ephemeral-storage limits
# and requests.
#
# Why this matters for VulnBank:
#   VulnBank accepts file uploads with no size validation (intentional vuln).
#   Without an ephemeral-storage limit, an attacker can fill the node disk by
#   uploading large files repeatedly, triggering DiskPressure and evicting
#   all other pods on the node — a denial of service at the infrastructure
#   level.
#
#   Memory and CPU limits prevent a compromised or runaway container from
#   starving other workloads (noisy neighbour / resource exhaustion attack).
#
# SonarQube flagged missing ephemeral-storage limits in Phase 1.
# This policy makes them mandatory going forward.

apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-limits
  annotations:
    policies.kyverno.io/title: Require Resource Limits
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      All containers must specify CPU, memory, and ephemeral-storage
      requests and limits to prevent resource exhaustion attacks.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: check-resource-limits
      match:
        any:
        - resources:
            kinds: ["Pod"]
            namespaces:
              - vuln-bank
              - vuln-bank-db
              - kong
      validate:
        message: >-
          All containers must define resources.limits and resources.requests
          for memory, cpu, and ephemeral-storage.
        foreach:
          - list: "request.object.spec.containers"
            deny:
              conditions:
                any:
                - key: "{{ element.resources.limits.memory || '' }}"
                  operator: Equals
                  value: ""
                - key: "{{ element.resources.limits.cpu || '' }}"
                  operator: Equals
                  value: ""
                - key: "{{ element.resources.limits.\"ephemeral-storage\" || '' }}"
                  operator: Equals
                  value: ""
                - key: "{{ element.resources.requests.memory || '' }}"
                  operator: Equals
                  value: ""
                - key: "{{ element.resources.requests.cpu || '' }}"
                  operator: Equals
                  value: ""
