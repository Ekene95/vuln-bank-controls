# observability-values.yaml — Helm values for loki-stack
#
# Configures Promtail to scrape from the correct paths and
# add pod/namespace labels to every log line so Grafana queries
# can filter by namespace, container name, and Falco rule.

grafana:
  enabled: true
  adminPassword: VulnBankLab2024
  service:
    type: ClusterIP
  resources:
    limits:
      memory: 256Mi
      cpu: 300m
    requests:
      memory: 128Mi
      cpu: 100m
  # Pre-configure the Loki datasource so dashboards work immediately
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Loki
          type: loki
          url: http://loki:3100
          access: proxy
          isDefault: true

loki:
  enabled: true
  # Disable persistence for the lab — logs are in-memory only
  persistence:
    enabled: false
  resources:
    limits:
      memory: 256Mi
      cpu: 300m
    requests:
      memory: 128Mi
      cpu: 100m
  # Retention: keep logs for 24 hours in the lab
  config:
    chunk_store_config:
      max_look_back_period: 24h
    table_manager:
      retention_deletes_enabled: true
      retention_period: 24h

promtail:
  enabled: true
  resources:
    limits:
      memory: 128Mi
      cpu: 200m
    requests:
      memory: 64Mi
      cpu: 50m
  config:
    clients:
      - url: http://loki:3100/loki/api/v1/push
    scrape_configs:
      # Scrape all pod logs and add k8s metadata as labels
      - job_name: kubernetes-pods
        pipeline_stages:
          # Parse JSON log lines from Falco
          - match:
              selector: '{app="falco"}'
              stages:
                - json:
                    expressions:
                      priority: priority
                      rule: rule
                      output: output
                - labels:
                    priority:
                    rule:
          # Parse Kong access logs
          - match:
              selector: '{app="kong-gateway"}'
              stages:
                - regex:
                    expression: '.*"response_status":(?P<status>\d+).*'
                - labels:
                    status:
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
