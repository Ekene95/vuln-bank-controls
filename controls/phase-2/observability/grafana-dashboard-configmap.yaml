# grafana-dashboard-configmap.yaml
#
# Grafana dashboard for VulnBank security monitoring.
# Pre-built with three panels:
#
#   Panel 1 — Falco Security Alerts
#     Shows all Falco alerts from vuln-bank and postgres containers,
#     colour-coded by priority (CRITICAL=red, ERROR=orange, WARNING=yellow).
#
#   Panel 2 — Kong Blocked Routes
#     Shows all requests that hit the request-termination plugin (404s
#     from /internal, /api/admin, /api/docs, /static/openapi.json).
#     These represent real attacker enumeration attempts.
#
#   Panel 3 — Rate Limit Events
#     Shows all 429 responses from Kong, indicating a rate limit trigger.
#     Spikes here correlate with brute-force attempts against the PIN reset.
#
# Apply with:
#   kubectl apply -f grafana-dashboard-configmap.yaml
#
# Grafana auto-loads ConfigMaps labelled grafana_dashboard: "1".
# No manual import needed — the dashboard appears on next Grafana restart.

apiVersion: v1
kind: ConfigMap
metadata:
  name: vuln-bank-security-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  vuln-bank-dashboard.json: |
    {
      "title": "VulnBank Security Monitoring",
      "uid": "vulnbank-sec-001",
      "timezone": "browser",
      "schemaVersion": 38,
      "refresh": "10s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Falco Security Alerts",
          "type": "logs",
          "gridPos": { "x": 0, "y": 0, "w": 24, "h": 8 },
          "datasource": "Loki",
          "options": {
            "showTime": true,
            "showLabels": true,
            "wrapLogMessage": true,
            "prettifyLogMessage": true,
            "enableLogDetails": true
          },
          "targets": [
            {
              "expr": "{app=\"falco\"} | json | priority =~ \"CRITICAL|ERROR|WARNING\"",
              "legendFormat": "{{rule}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "title": "Kong — Blocked Route Attempts (404 from request-termination)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 8, "w": 12, "h": 8 },
          "datasource": "Loki",
          "fieldConfig": {
            "defaults": {
              "color": { "fixedColor": "red", "mode": "fixed" }
            }
          },
          "targets": [
            {
              "expr": "sum(count_over_time({namespace=\"kong\"} |= \"404\" | json [1m]))",
              "legendFormat": "Blocked requests / min",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "Kong — Rate Limit Triggers (429)",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 8, "w": 12, "h": 8 },
          "datasource": "Loki",
          "fieldConfig": {
            "defaults": {
              "color": { "fixedColor": "orange", "mode": "fixed" }
            }
          },
          "targets": [
            {
              "expr": "sum(count_over_time({namespace=\"kong\"} |= \"429\" | json [1m]))",
              "legendFormat": "Rate limit hits / min",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "title": "Falco Alert Count by Rule (Last 1h)",
          "type": "bargauge",
          "gridPos": { "x": 0, "y": 16, "w": 24, "h": 8 },
          "datasource": "Loki",
          "options": {
            "orientation": "horizontal",
            "reduceOptions": { "calcs": ["sum"] }
          },
          "targets": [
            {
              "expr": "sum by (rule) (count_over_time({app=\"falco\"} | json | rule != \"\" [1h]))",
              "legendFormat": "{{rule}}",
              "refId": "A"
            }
          ]
        }
      ]
    }
