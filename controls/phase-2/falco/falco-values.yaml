# falco-values.yaml — Helm values for Falco installation
#
# Configures Falco to:
#   1. Load custom rules from a ConfigMap (vuln-bank-specific detections)
#   2. Output alerts to stdout in JSON for Loki to collect
#   3. Use modern_ebpf driver (no kernel module compilation needed)

driver:
  kind: modern_ebpf

# Output alerts as JSON to stdout.
# Loki (via Promtail) will scrape these from pod logs.
falco:
  json_output: true
  json_include_output_property: true
  log_stderr: true
  log_syslog: false
  log_level: info

  # Load our custom rules alongside the default ruleset.
  # The ConfigMap is created by falco-custom-rules.yaml.
  rules_files:
    - /etc/falco/falco_rules.yaml
    - /etc/falco/falco_rules.local.yaml
    - /etc/falco/custom_rules/vuln-bank-rules.yaml

# Mount the custom rules ConfigMap into the Falco pod
extraVolumes:
  - name: custom-rules
    configMap:
      name: falco-vuln-bank-rules

extraVolumeMounts:
  - name: custom-rules
    mountPath: /etc/falco/custom_rules
    readOnly: true

resources:
  limits:
    memory: 512Mi
    cpu: 500m
  requests:
    memory: 256Mi
    cpu: 100m
