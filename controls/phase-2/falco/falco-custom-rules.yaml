# falco-custom-rules.yaml
#
# ConfigMap containing VulnBank-specific Falco detection rules.
#
# Each rule is mapped to a specific VulnBank vulnerability and documents
# what attacker behaviour it is designed to catch.
#
# Apply with:
#   kubectl apply -f falco-custom-rules.yaml
#
# After applying, restart Falco to load the rules:
#   kubectl rollout restart daemonset/falco -n falco
#
# Test a rule by triggering the behaviour and watching logs:
#   kubectl logs -n falco -l app.kubernetes.io/name=falco -f | grep vuln-bank

apiVersion: v1
kind: ConfigMap
metadata:
  name: falco-vuln-bank-rules
  namespace: falco
data:
  vuln-bank-rules.yaml: |

    # ─────────────────────────────────────────────────────────────
    # MACRO: identify the vuln-bank container
    # ─────────────────────────────────────────────────────────────
    - macro: in_vuln_bank_container
      condition: container.name = "vuln-bank"

    - macro: in_postgres_container
      condition: container.name = "postgres"

    # ─────────────────────────────────────────────────────────────
    # RULE 1: Shell spawned inside vuln-bank container
    #
    # Maps to: Unrestricted file upload + path traversal (RCE path)
    #
    # If an attacker uploads a reverse shell script via the file upload
    # endpoint and triggers execution via path traversal, this rule fires
    # the moment a shell process is spawned.
    #
    # Expected normal behaviour: Flask never spawns a shell.
    # Anything spawning sh, bash, or zsh in this container is an anomaly.
    # ─────────────────────────────────────────────────────────────
    - rule: Shell Spawned in VulnBank Container
      desc: >
        A shell was spawned inside the vuln-bank container. This may indicate
        RCE via the unrestricted file upload or path traversal vulnerability.
      condition: >
        spawned_process
        and in_vuln_bank_container
        and proc.name in (shell_binaries)
      output: >
        CRITICAL Shell spawned in vuln-bank container
        (user=%user.name shell=%proc.name parent=%proc.pname
        cmdline=%proc.cmdline container=%container.id
        image=%container.image.repository)
      priority: CRITICAL
      tags: [vuln-bank, rce, shell, T1059]

    # ─────────────────────────────────────────────────────────────
    # RULE 2: Unexpected outbound connection from vuln-bank
    #
    # Maps to: SSRF via /upload_profile_picture_url
    #
    # The NetworkPolicy blocks most egress but only at TCP level.
    # Falco catches the attempt at the syscall level — even if
    # NetworkPolicy drops the packet, the connect() syscall fires first
    # and Falco sees it. This provides detection even when prevention works.
    #
    # Legitimate egress from vuln-bank:
    #   - postgres-svc.vuln-bank-db:5432 (database)
    #   - kube-dns:53 (DNS)
    # Anything else is suspicious.
    # ─────────────────────────────────────────────────────────────
    - rule: Unexpected Outbound Connection from VulnBank
      desc: >
        The vuln-bank container made an outbound connection to an unexpected
        destination. This may indicate SSRF exploitation.
      condition: >
        outbound
        and in_vuln_bank_container
        and not fd.sport in (5432, 53)
        and not fd.sip in ("127.0.0.1")
      output: >
        WARNING Unexpected outbound connection from vuln-bank
        (user=%user.name connection=%fd.name container=%container.id
        image=%container.image.repository proc=%proc.name)
      priority: WARNING
      tags: [vuln-bank, ssrf, network, T1071]

    # ─────────────────────────────────────────────────────────────
    # RULE 3: Sensitive file read in vuln-bank container
    #
    # Maps to: Information disclosure / post-compromise credential harvesting
    #
    # After gaining RCE, an attacker typically reads /etc/passwd for user
    # enumeration and /etc/shadow for credential harvesting. Flask has no
    # reason to read either of these files.
    # ─────────────────────────────────────────────────────────────
    - rule: Sensitive File Read in VulnBank Container
      desc: >
        A sensitive system file was read inside the vuln-bank container.
        This may indicate post-compromise reconnaissance.
      condition: >
        open_read
        and in_vuln_bank_container
        and fd.name in (/etc/passwd, /etc/shadow, /etc/sudoers,
                        /proc/self/environ, /proc/self/maps,
                        /run/secrets/kubernetes.io/serviceaccount/token)
      output: >
        HIGH Sensitive file read in vuln-bank container
        (user=%user.name file=%fd.name proc=%proc.name
        cmdline=%proc.cmdline container=%container.id)
      priority: ERROR
      tags: [vuln-bank, credential-access, T1552]

    # ─────────────────────────────────────────────────────────────
    # RULE 4: Executable written to /tmp in vuln-bank container
    #
    # Maps to: RCE + attacker tool staging
    #
    # A common post-RCE pattern is to write a tool (e.g. a port scanner,
    # privilege escalation exploit, or lateral movement tool) to /tmp
    # and set the executable bit. The readOnlyRootFilesystem policy means
    # writes to / fail, but /tmp is an emptyDir mount which is writable.
    # ─────────────────────────────────────────────────────────────
    - rule: Executable Written to Writable Mount in VulnBank
      desc: >
        A file was written with executable permissions to a writable mount
        (/tmp or /app/static/uploads) in the vuln-bank container. This may
        indicate an attacker staging a tool after achieving RCE.
      condition: >
        open_write
        and in_vuln_bank_container
        and (fd.directory startswith "/tmp" or
             fd.directory startswith "/app/static/uploads")
        and (evt.arg.flags contains "O_CREAT")
      output: >
        HIGH Executable written to writable mount in vuln-bank
        (user=%user.name file=%fd.name flags=%evt.arg.flags
        proc=%proc.name container=%container.id)
      priority: ERROR
      tags: [vuln-bank, persistence, T1105]

    # ─────────────────────────────────────────────────────────────
    # RULE 5: Unexpected process in postgres container
    #
    # Maps to: Lateral movement — if vuln-bank is compromised and an
    # attacker breaks through the NetworkPolicy to reach postgres, any
    # unexpected process in the postgres container is a strong signal.
    #
    # The only process that should run in the postgres container is the
    # postgres binary itself and its child processes.
    # ─────────────────────────────────────────────────────────────
    - rule: Unexpected Process in Postgres Container
      desc: >
        An unexpected process was spawned in the postgres container.
        Only postgres and its direct child processes are expected here.
      condition: >
        spawned_process
        and in_postgres_container
        and not proc.name in (postgres, pg_ctl, initdb, sh)
        and not proc.pname in (postgres, pg_ctl, initdb, sh)
      output: >
        CRITICAL Unexpected process in postgres container
        (user=%user.name proc=%proc.name parent=%proc.pname
        cmdline=%proc.cmdline container=%container.id)
      priority: CRITICAL
      tags: [postgres, lateral-movement, T1059]

    # ─────────────────────────────────────────────────────────────
    # RULE 6: Service account token read in any app container
    #
    # Maps to: Kubernetes API credential theft
    #
    # automountServiceAccountToken: false means the token file should
    # not exist at all. If it does (e.g. if the policy was bypassed or
    # the token was injected by another mechanism), Falco catches the read.
    # ─────────────────────────────────────────────────────────────
    - rule: K8s Service Account Token Read
      desc: >
        A process read the Kubernetes service account token. This credential
        can be used to enumerate or interact with the Kubernetes API.
      condition: >
        open_read
        and (in_vuln_bank_container or in_postgres_container)
        and fd.name = "/run/secrets/kubernetes.io/serviceaccount/token"
      output: >
        CRITICAL Kubernetes service account token read
        (user=%user.name proc=%proc.name container=%container.id
        image=%container.image.repository)
      priority: CRITICAL
      tags: [credential-access, kubernetes, T1528]
