name: Build, Sign, and Attest

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      attestations: write
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Build Docker image
      id: build-image
      run: |
        docker build -t ghcr.io/${{ github.repository_owner }}/vuln-bank:${{ github.sha }} .
        docker push ghcr.io/${{ github.repository_owner }}/vuln-bank:${{ github.sha }}
        echo "digest=$(docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/${{ github.repository_owner }}/vuln-bank:${{ github.sha }} | cut -d@ -f2)" >> $GITHUB_OUTPUT

    - name: Sign image with Cosign
      uses: sigstore/cosign-installer@v3
    - run: |
        cosign sign ghcr.io/${{ github.repository_owner }}/vuln-bank@sha256:${{ steps.build-image.outputs.digest }}

    - name: Generate SLSA provenance
      uses: actions/attest-build-provenance@v1
      with:
        subject-name: ghcr.io/${{ github.repository_owner }}/vuln-bank
        subject-digest: sha256:${{ steps.build-image.outputs.digest }}
        push-to-registry: true
