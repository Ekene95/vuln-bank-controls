# File: manifests/network-policies/vuln-bank-netpol.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vuln-bank-netpol
  namespace: vuln-bank
spec:
  podSelector:
    matchLabels:
      app: vuln-bank
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Only accept traffic from Kong gateway namespace
  - from:
    - namespaceSelector:
        matchLabels:
          name: kong
    ports:
    - port: 5000
  egress:
  # Allow DNS resolution
  - to:
    - namespaceSelector: {}
    ports:
    - port: 53
      protocol: UDP
  # Allow connection to PostgreSQL only
  - to:
    - namespaceSelector:
        matchLabels:
          name: vuln-bank-db
      podSelector:
        matchLabels:
          app: postgres
    ports:
    - port: 5432
  # BLOCK everything else — including SSRF to cluster metadata, host network