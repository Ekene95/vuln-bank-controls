apiVersion: apps/v1
kind: Deployment
metadata:
  name: vuln-bank
  namespace: vuln-bank
  labels:
    app: vuln-bank
    tier: application
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vuln-bank
  template:
    metadata:
      labels:
        app: vuln-bank
        tier: application
    spec:
      automountServiceAccountToken: false  # Satisfies: disable-automount-sa-token
      securityContext:
        runAsNonRoot: true                 # Satisfies: deny-root-pods
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: vuln-bank
        image: vuln-bank:v1.0
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
        securityContext:
          runAsNonRoot: true               # Satisfies: deny-root-pods
          runAsUser: 1000
          readOnlyRootFilesystem: true     # Satisfies: require-readonly-rootfs
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]                  # Drop all Linux capabilities
        env:
        - name: DB_HOST
          value: postgres-svc.vuln-bank-db.svc.cluster.local
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: vulnerable_bank
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: vuln-bank-db-secret
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: vuln-bank-db-secret
              key: password
        resources:
          limits:
            memory: 256Mi
            cpu: 500m
            ephemeral-storage: 512Mi      # Satisfies: require-resource-limits
          requests:
            memory: 128Mi
            cpu: 100m
            ephemeral-storage: 128Mi
        volumeMounts:
        - name: uploads                    # Writable uploads dir — required because
          mountPath: /app/static/uploads   # readOnlyRootFilesystem: true blocks writes
        - name: tmp                        # Flask/Werkzeug needs /tmp for temp files
          mountPath: /tmp
        livenessProbe:
          httpGet:
            path: /login
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 15
      volumes:
      - name: uploads
        emptyDir: {}  # Ephemeral — cleared on pod restart, intentional for lab
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: vuln-bank-svc
  namespace: vuln-bank
spec:
  selector:
    app: vuln-bank
  ports:
  - port: 5000
    targetPort: 5000
  type: ClusterIP
